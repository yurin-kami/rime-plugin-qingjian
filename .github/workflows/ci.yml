# 持续集成：每个提交/PR 都在 Linux 与 macOS 上跑单元测试与插件编译。
#
# 生产标准对应 AGENTS.md：
#   - make check：C++ 单测 + Python 单测 + 跨语言对拍
#   - make so   ：编译插件（Linux .so / macOS .dylib），-Wall -Wextra 零警告
#
# 插件依赖 librime 内部头（不在发行版头包里），故克隆 librime 源码树；
# 链接用的 librime 库：Linux 从源码构建安装，macOS 用 Homebrew 预编译包。
# 单元测试是纯 C++/Python，不依赖 librime。

name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test-and-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 \
            libboost-all-dev libgoogle-glog-dev libyaml-cpp-dev \
            libleveldb-dev libmarisa-dev libopencc-dev

      - name: 单元测试（make check）
        run: make check

      - name: 克隆并构建 librime
        run: |
          mkdir -p .analysis
          git clone --depth 1 https://github.com/rime/librime .analysis/librime
          cmake -S .analysis/librime -B .analysis/librime/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=OFF -DBUILD_DATA=OFF
          cmake --build .analysis/librime/build -j"$(nproc)"
          sudo cmake --install .analysis/librime/build
          sudo ldconfig

      - name: 编译插件（零警告）
        run: make so RIME_SRC=.analysis/librime

      - name: 校验插件产物
        run: |
          test -f librime-qingjian.so
          nm -D librime-qingjian.so | grep -q rime_require_module_qingjian
          echo "librime-qingjian.so 已产出且导出模块符号"

  test-and-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: brew install boost librime

      - name: 单元测试（make check）
        run: make check

      - name: 克隆 librime 源码（取内部头）
        run: |
          mkdir -p .analysis
          git clone --depth 1 https://github.com/rime/librime .analysis/librime

      - name: 编译插件（零警告，产物为 .dylib）
        run: make so RIME_SRC=.analysis/librime

      - name: 校验插件产物
        run: |
          test -f librime-qingjian.dylib
          nm -gU librime-qingjian.dylib | grep -q rime_require_module_qingjian
          echo "librime-qingjian.dylib 已产出且导出模块符号"
